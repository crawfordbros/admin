<!doctype html>
<html lang="en">
<!-- CBES design reference exported from Claude Design, Oct 2026. Layout and copy reference only; rebuild as React components. -->
<head>
<meta charset="utf-8">
<title>Valet app – log a violation</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@500;600;700&amp;family=Open+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C8BBA5}a:hover{color:#FFFFFF}
</style>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #12143F; color: #FFFFFF; font-family: 'Open Sans', sans-serif; display: flex; flex-direction: column;">
<div style="padding: 20px 20px 12px; display: flex; align-items: center; justify-content: space-between;">
<div>
<p style="margin: 0; font-size: 12px; color: #C8BBA5; font-weight: 600; letter-spacing: 0.08em;">[COMMUNITY A] · BLDG 4</p>
<h1 style="margin: 2px 0 0; font-family: 'Fira Sans', sans-serif; font-size: 22px;">Log a violation</h1>
</div>
<span style="background: #1F6B3A; color: #FFFFFF; font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 999px;">On route · 64 / 120</span>
</div>

<div style="margin: 0 20px; height: 220px; border-radius: 16px; background: #23266B; border: 2px dashed #6E72C4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #E6E7F2; font-size: 14px; text-align: center; padding: 16px; box-sizing: border-box;">
<svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#E6E7F2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
Photo of the trash and doorway<br>(never people)
</div>

<div style="padding: 16px 20px 0; display: flex; gap: 10px;">
<div style="flex: 1; background: #23266B; border-radius: 12px; padding: 12px;"><p style="margin: 0; font-size: 12px; color: #C8BBA5;">Unit</p><p style="margin: 2px 0 0; font-size: 18px; font-weight: 700;">412</p></div>
<div style="flex: 1; background: #23266B; border-radius: 12px; padding: 12px;"><p style="margin: 0; font-size: 12px; color: #C8BBA5;">Time · GPS</p><p style="margin: 2px 0 0; font-size: 18px; font-weight: 700;">8:47 PM ✓</p></div>
</div>

<fieldset style="border: none; margin: 0; padding: 16px 20px 0;">
<legend style="font-size: 14px; font-weight: 600; margin-bottom: 10px; padding: 0;">What's wrong?</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<button type="button" style="min-height: 56px; border-radius: 12px; border: 2px solid #FFFFFF; background: #FFFFFF; color: #272B84; font-size: 15px; font-weight: 700;">Bag not tied</button>
<button type="button" style="min-height: 56px; border-radius: 12px; border: 2px solid #4A4E9E; background: transparent; color: #FFFFFF; font-size: 15px; font-weight: 600;">Outside container</button>
<button type="button" style="min-height: 56px; border-radius: 12px; border: 2px solid #4A4E9E; background: transparent; color: #FFFFFF; font-size: 15px; font-weight: 600;">Over-filled</button>
<button type="button" style="min-height: 56px; border-radius: 12px; border: 2px solid #4A4E9E; background: transparent; color: #FFFFFF; font-size: 15px; font-weight: 600;">After 8 PM</button>
<button type="button" style="min-height: 56px; border-radius: 12px; border: 2px solid #4A4E9E; background: transparent; color: #FFFFFF; font-size: 15px; font-weight: 600;">Prohibited item</button>
<button type="button" style="min-height: 56px; border-radius: 12px; border: 2px solid #4A4E9E; background: transparent; color: #FFFFFF; font-size: 15px; font-weight: 600;">Bulk item at door</button>
</div>
</fieldset>

<label style="margin: 14px 20px 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600;">Note (optional)<input type="text" placeholder="e.g. left in place, not safe to carry" style="height: 48px; border-radius: 10px; border: 1px solid #4A4E9E; background: #23266B; color: #FFFFFF; padding: 0 12px; font-size: 15px;"></label>

<div style="margin-top: auto; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 10px;">
<button type="button" style="height: 56px; border-radius: 12px; border: none; background: #FFFFFF; color: #272B84; font-size: 17px; font-weight: 700;">Save violation</button>
<p style="margin: 0; text-align: center; font-size: 12px; color: #C8BBA5;">Saves offline and syncs when you have signal · Español</p>
</div>
</div>
</body>
</html>

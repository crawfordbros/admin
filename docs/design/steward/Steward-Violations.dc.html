<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Steward – My violations</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@500;600;700&amp;family=Open+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C8BBA5}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #12143F; color: #FFFFFF; font-family: 'Open Sans', sans-serif; display: flex; flex-direction: column;">
<div role="status" style="margin: 12px 20px 0; padding: 12px 14px; border-radius: 14px; background: #143D2E; display: flex; gap: 10px; align-items: center; font-size: 14px;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4CC38A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg><span><strong>Saved.</strong> Over-filled · Unit 118 is on its way to your Steward.</span></div>
<header style="padding: 14px 20px 8px; display: flex; justify-content: space-between; align-items: flex-end;">
<h1 style="margin: 0; font-family: 'Fira Sans', sans-serif; font-size: 24px;">My violations</h1>
<span style="font-size: 13px; color: #C9CAF0;">The Oaks at Decatur</span>
</header>
<div style="padding: 0 20px; display: flex; flex-direction: column; gap: 12px; flex: 1; overflow: hidden;">
<div role="tablist" aria-label="When" style="display: flex; background: #1C1F5A; border-radius: 12px; padding: 4px;">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button type="button" role="tab" aria-selected="{{t.sel}}" style="{{t.style}}">{{t.label}}</button></sc-for>
</div>
<div style="display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: #3F3215; color: #F5C26B; font-size: 13px; font-weight: 700;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"></path></svg><span style="flex: 1;">1 waiting to sync. It sends when you have signal.</span><button type="button" style="height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid #F5C26B; background: transparent; color: #F5C26B; font-weight: 700; font-size: 12.5px;">Retry</button></div>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px;">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<li><a href="#" style="display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: #1C1F5A; text-decoration: none; color: #FFFFFF;">
<span aria-hidden="true" style="flex: none; width: 56px; height: 56px; border-radius: 10px; background: #2E3290; display: flex; align-items: center; justify-content: center; color: #6E72C4;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></span>
<span style="flex: 1; min-width: 0;"><span style="display: block; font-weight: 700; font-size: 15px;">{{r.type}} · {{r.unit}}</span><span style="display: block; font-size: 12.5px; color: #C9CAF0;">{{r.when}}</span><sc-if value="{{r.note}}" hint-placeholder-val="{{ false }}"><span style="display: flex; gap: 6px; align-items: center; margin-top: 4px; font-size: 12px; color: #C8BBA5; font-weight: 700;"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>{{r.note}}</span></sc-if></span>
<span style="{{r.stStyle}}">{{r.st}}</span>
</a></li>
</sc-for>
</ul>
</div>
<div style="padding: 12px 20px;"><a href="Steward-LogViolation.dc.html" style="height: 56px; border-radius: 16px; background: #FFFFFF; color: #1A1C5E; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Log another</a></div>
<dc-import name="StewardTabBar" role="valet" active="violations" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tOn = 'flex: 1; border: none; padding: 9px 4px; border-radius: 9px; background: #FFFFFF; color: #1A1C5E; font-weight: 700; font-size: 13.5px;';
    const tOff = 'flex: 1; border: none; padding: 9px 4px; border-radius: 9px; background: transparent; color: #C9CAF0; font-weight: 600; font-size: 13.5px;';
    const tabs = [['Tonight', 0], ['This week', 1], ['All', 0]].map(t => ({ label: t[0], sel: t[1] ? 'true' : 'false', style: t[1] ? tOn : tOff }));
    const pill = (bg, fg) => 'flex: none; font-size: 11.5px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: ' + bg + '; color: ' + fg + ';';
    const S = {
      'Waiting to sync': pill('#3F3215', '#F5C26B'), 'New': pill('#262A6E', '#C9CAF0'), 'In review': pill('#3F3215', '#F5C26B'),
      'Sent to property': pill('#1B2E5C', '#8DB4FF'), 'Resolved': pill('#143D2E', '#4CC38A'), 'Dismissed': pill('#262A6E', '#9FA2D6'),
    };
    const rows = [
      ['Over-filled', 'Unit 118', 'Tonight 9:14 PM · Bldg 1', 'Waiting to sync', ''],
      ['Bag not tied', 'Unit 214', 'Tonight 8:31 PM · Bldg 2', 'New', ''],
      ['Bag not tied', 'Unit 412', 'Mon 9:14 PM · Bldg 4', 'Sent to property', 'Note from Nigel Crawford'],
      ['After 8 PM', 'Unit 108', 'Sun 8:20 PM · Bldg 1', 'Resolved', ''],
      ['Outside container', 'Unit 122', 'Sun 8:05 PM · Bldg 1', 'Dismissed', 'Nigel: that bin belongs to Unit 124'],
    ].map(r => ({ type: r[0], unit: r[1], when: r[2], st: r[3], stStyle: S[r[3]], note: r[4] }));
    return { tabs, rows };
  }
}
</script>
</body>
</html>

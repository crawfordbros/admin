<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Steward – Profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@500;600;700&amp;family=Open+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C8BBA5}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #12143F; color: #FFFFFF; font-family: 'Open Sans', sans-serif; display: flex; flex-direction: column;">
<div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 12px; flex: 1; overflow: hidden;">
<section style="display: flex; gap: 14px; align-items: center;">
<span style="position: relative; flex: none;"><span aria-hidden="true" style="width: 76px; height: 76px; border-radius: 50%; background: #3A3E99; border: 3px solid #C8BBA5; display: flex; align-items: center; justify-content: center; overflow: hidden;"><svg width="50" height="50" viewBox="0 0 24 24" fill="#6E72C4"><circle cx="12" cy="9" r="4.2"></circle><path d="M3.5 22c.8-4.6 4.3-7.2 8.5-7.2s7.7 2.6 8.5 7.2z"></path></svg></span><button type="button" aria-label="Change photo" style="position: absolute; right: -4px; bottom: -2px; width: 32px; height: 32px; border-radius: 50%; border: 3px solid #12143F; background: #FFFFFF; color: #1A1C5E; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></button></span>
<div style="flex: 1;"><h1 style="margin: 0; font-family: 'Fira Sans', sans-serif; font-size: 23px;">Marcus Hill</h1><p style="margin: 2px 0 0; font-size: 13.5px; color: #C8BBA5; font-weight: 700;">Valet · since Sep 2026</p><p style="margin: 2px 0 0; font-size: 12.5px; color: #C9CAF0;">Steward: Dana Brooks</p></div>
<button type="button" style="height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid #4A4E9E; background: transparent; color: #FFFFFF; font-weight: 700; font-size: 13px;">Edit</button>
</section>

<section aria-label="This week" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="4"><div style="background: #1C1F5A; border-radius: 12px; padding: 10px 8px; text-align: center;"><span style="display: block; font-family: 'Fira Sans', sans-serif; font-size: 20px; font-weight: 700;">{{s.v}}</span><span style="display: block; font-size: 11px; color: #C9CAF0;">{{s.k}}</span></div></sc-for>
</section>

<section style="background: #1C1F5A; border-radius: 16px; padding: 12px 16px;">
<div style="display: flex; justify-content: space-between; align-items: baseline;"><h2 style="margin: 0; font-size: 15px; font-weight: 700;">My properties</h2><span style="font-size: 12px; color: #9FA2D6;">Assigned by your Steward</span></div>
<ul style="margin: 8px 0 0; padding: 0; list-style: none;">
<sc-for list="{{props}}" as="p" hint-placeholder-count="2"><li style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid #2E3290;"><span><strong style="display: block; font-size: 14.5px;">{{p.name}}</strong><span style="font-size: 12.5px; color: #C9CAF0;">{{p.sub}}</span></span><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9FA2D6" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"></path></svg></li></sc-for>
</ul>
</section>

<section style="background: #1C1F5A; border-radius: 16px; padding: 4px 16px;">
<sc-for list="{{settings}}" as="s" hint-placeholder-count="5"><a href="#" style="display: flex; justify-content: space-between; align-items: center; min-height: 50px; border-bottom: 1px solid #2E3290; text-decoration: none; color: #FFFFFF; font-size: 14.5px;"><span>{{s.k}}</span><span style="display: flex; gap: 8px; align-items: center; color: #C9CAF0; font-size: 13.5px;">{{s.v}}<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9FA2D6" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"></path></svg></span></a></sc-for>
<button type="button" style="width: 100%; min-height: 50px; border: none; background: transparent; color: #FF8A7A; font-weight: 700; font-size: 14.5px; text-align: left; padding: 0;">Sign out</button>
</section>
</div>
<div style="height: 12px;"></div>
<dc-import name="StewardTabBar" role="valet" active="me" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const stats = [['4', 'Shifts'], ['15.2', 'Hours'], ['11', 'Violations'], ['3', 'Issues fixed']].map(s => ({ v: s[0], k: s[1] }));
    const props = [['The Oaks at Decatur', 'Bldgs 1–2 · Sun–Thu · 8:00 PM'], ['Clarkston Commons', 'All buildings · Sun–Thu · 10:15 PM']].map(p => ({ name: p[0], sub: p[1] }));
    const settings = [['Check-in history', 'This week'], ['Mobile phone', '(404) 555-0119'], ['Language', 'English'], ['Text messages', 'On'], ['Sign-in methods', 'Passkey'], ['Crew guide', '']].map(s => ({ k: s[0], v: s[1] }));
    return { stats, props, settings };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Steward – Create your profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@500;600;700&amp;family=Open+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C8BBA5}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #12143F; color: #FFFFFF; font-family: 'Open Sans', sans-serif; display: flex; flex-direction: column; padding: 18px 24px 24px;">
<div style="display: flex; align-items: center; justify-content: space-between;">
<a href="Steward-SignIn.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 12px; background: #1C1F5A; display: flex; align-items: center; justify-content: center; color: #FFFFFF;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
<span style="font-size: 13px; font-weight: 700; color: #C8BBA5;">Step 1 of 3</span>
</div>
<div aria-hidden="true" style="display: flex; gap: 6px; margin-top: 14px;"><span style="flex: 1; height: 5px; border-radius: 999px; background: #C8BBA5;"></span><span style="flex: 1; height: 5px; border-radius: 999px; background: #2E3290;"></span><span style="flex: 1; height: 5px; border-radius: 999px; background: #2E3290;"></span></div>

<h1 style="margin: 22px 0 0; font-family: 'Fira Sans', sans-serif; font-size: 27px;">Create your profile</h1>
<p style="margin: 6px 0 0; font-size: 14.5px; color: #C9CAF0; line-height: 1.5;">Your crew, your Steward and the property managers you serve will see your photo and name.</p>

<div style="display: flex; flex-direction: column; align-items: center; margin-top: 22px; gap: 10px;">
<div style="position: relative;">
<span role="img" aria-label="Your profile photo" style="width: 132px; height: 132px; border-radius: 50%; background: #3A3E99; border: 4px solid #C8BBA5; display: flex; align-items: center; justify-content: center; overflow: hidden;"><svg aria-hidden="true" width="86" height="86" viewBox="0 0 24 24" fill="#6E72C4"><circle cx="12" cy="9" r="4.2"></circle><path d="M3.5 22c.8-4.6 4.3-7.2 8.5-7.2s7.7 2.6 8.5 7.2z"></path></svg></span>
<button type="button" aria-label="Retake photo" style="position: absolute; right: -2px; bottom: 4px; width: 44px; height: 44px; border-radius: 50%; border: 3px solid #12143F; background: #FFFFFF; color: #1A1C5E; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></button>
</div>
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #4CC38A;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>Photo added · <a href="#" style="color: #C8BBA5;">Retake</a></span>
</div>

<ul style="margin: 16px 0 0; padding: 12px 14px; list-style: none; background: #1C1F5A; border-radius: 12px; font-size: 13px; color: #C9CAF0; display: flex; flex-direction: column; gap: 6px;">
<sc-for list="{{rules}}" as="r" hint-placeholder-count="3"><li style="display: flex; gap: 8px; align-items: center;"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C8BBA5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>{{r}}</li></sc-for>
</ul>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px;">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600;">First name<input type="text" value="Marcus" required autocomplete="given-name" style="height: 56px; border-radius: 12px; border: 1px solid #4A4E9E; background: #23266B; color: #FFFFFF; padding: 0 14px; font-size: 16px; min-width: 0;"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600;">Last name<input type="text" value="Hill" required autocomplete="family-name" style="height: 56px; border-radius: 12px; border: 1px solid #4A4E9E; background: #23266B; color: #FFFFFF; padding: 0 14px; font-size: 16px; min-width: 0;"></label>
</div>
<p style="margin: 10px 0 0; font-size: 13px; color: #9FA2D6;">Invited as <strong style="color: #FFFFFF;">Valet</strong> · marcus.hill@email.com</p>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
<a href="Steward-SetupSecurity.dc.html" style="height: 58px; border-radius: 14px; background: #FFFFFF; color: #1A1C5E; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none;">Continue</a>
<p style="margin: 0; text-align: center; font-size: 12.5px; color: #9FA2D6;">Photo and both names are required.</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { rules: ['Your face, looking at the camera', 'No hat, sunglasses or filters', 'Good light, plain background'] };
  }
}
</script>
</body>
</html>

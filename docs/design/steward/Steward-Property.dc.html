<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Steward – Property</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@500;600;700&amp;family=Open+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C8BBA5}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #12143F; color: #FFFFFF; font-family: 'Open Sans', sans-serif; display: flex; flex-direction: column;">
<div aria-hidden="true" style="height: 132px; background: #23266B; display: flex; align-items: center; justify-content: center; color: #6E72C4; flex: none;"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6"></path></svg></div>
<div style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 12px; flex: 1; overflow: hidden;">
<div>
<div role="group" aria-label="Your properties" style="display: flex; gap: 6px; margin-bottom: 10px;"><button type="button" aria-pressed="true" style="border: none; border-radius: 999px; padding: 7px 12px; background: #FFFFFF; color: #1A1C5E; font-weight: 700; font-size: 13px;">The Oaks at Decatur</button><button type="button" aria-pressed="false" style="border: 1px solid #4A4E9E; border-radius: 999px; padding: 7px 12px; background: transparent; color: #C9CAF0; font-weight: 700; font-size: 13px;">Clarkston Commons</button></div>
<h1 style="margin: 0; font-family: 'Fira Sans', sans-serif; font-size: 24px;">The Oaks at Decatur</h1>
<p style="margin: 2px 0 0; font-size: 13.5px; color: #C9CAF0;">2150 Lawrenceville Hwy, Decatur · 312 units · 6 buildings</p>
</div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
<a href="#" style="height: 52px; border-radius: 12px; background: #FFFFFF; color: #1A1C5E; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8z"></path></svg>Directions</a>
<a href="tel:" style="height: 52px; border-radius: 12px; border: 1px solid #4A4E9E; color: #FFFFFF; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>Call Steward</a>
</div>

<section style="background: #1C1F5A; border-radius: 16px; padding: 4px 16px;">
<sc-for list="{{facts}}" as="f" hint-placeholder-count="4"><div style="display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid #2E3290; font-size: 14px;"><span style="color: #C9CAF0;">{{f.k}}</span><strong style="text-align: right;">{{f.v}}</strong></div></sc-for>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; font-size: 14px;"><span style="color: #C9CAF0;">Gate code</span><button type="button" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #4A4E9E; background: transparent; color: #FFFFFF; font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px;"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>Tap to show</button></div>
</section>

<section style="background: #1C1F5A; border-radius: 16px; padding: 12px 16px;">
<h2 style="margin: 0 0 8px; font-size: 15px; font-weight: 700;">Buildings</h2>
<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
<sc-for list="{{bldgs}}" as="b" hint-placeholder-count="6"><span style="{{b.style}}"><strong style="display: block; font-size: 15px;">{{b.name}}</strong><span style="font-size: 11.5px;">{{b.sub}}</span></span></sc-for>
</div>
</section>

<section style="background: #1C1F5A; border-radius: 16px; padding: 12px 16px;">
<h2 style="margin: 0 0 8px; font-size: 15px; font-weight: 700;">Crew tonight</h2>
<div style="display: flex; gap: 14px;">
<sc-for list="{{crew}}" as="c" hint-placeholder-count="4"><span style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; text-align: center; width: 64px;"><span style="{{c.av}}">{{c.i}}</span>{{c.name}}<span style="{{c.tagStyle}}">{{c.tag}}</span></span></sc-for>
</div>
</section>
</div>
<dc-import name="StewardTabBar" role="valet" active="property" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const facts = [['Service nights', 'Sun–Thu'], ['Trash out', '6–8 PM · pickup from 8 PM'], ['Compactor', 'Behind Bldg 6, by the pool gate'], ['Leasing office', '(404) 555-0136']].map(f => ({ k: f[0], v: f[1] }));
    const bs = (mine) => 'border-radius: 10px; padding: 8px 10px; ' + (mine ? 'background: #FFFFFF; color: #1A1C5E;' : 'background: #23266B; color: #C9CAF0;');
    const bldgs = [['Bldg 1', '52 doors · you', 1], ['Bldg 2', '52 doors · you', 1], ['Bldg 3', '52 · Tasha', 0], ['Bldg 4', '52 · Tasha', 0], ['Bldg 5', '52 · Jorge', 0], ['Bldg 6', '52 · Jorge', 0]].map(b => ({ name: b[0], sub: b[1], style: bs(b[2]) }));
    const av = (c) => 'width: 44px; height: 44px; border-radius: 50%; background: ' + c + '; color: #FFFFFF; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; border: 2px solid #12143F;';
    const tag = (on) => 'font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 999px; ' + (on ? 'background: #143D2E; color: #4CC38A;' : 'background: #4A1D25; color: #FF8A7A;');
    const crew = [['Dana', 'DB', '#928064', 'Steward', 1], ['Marcus', 'MH', '#3A3E99', 'In', 1], ['Tasha', 'TR', '#1F6B3A', 'In', 1], ['Jorge', 'JR', '#7A6A50', 'Not in', 0]].map(c => ({ name: c[0], i: c[1], av: av(c[2]), tag: c[3], tagStyle: tag(c[4]) }));
    return { facts, bldgs, crew };
  }
}
</script>
</body>
</html>

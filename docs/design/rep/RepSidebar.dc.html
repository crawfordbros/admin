<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portal sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@500;600;700&amp;family=Open+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Property Portal" style="width: 100%; min-height: 960px; box-sizing: border-box; background: #1A1C5E; color: #E6E7F2; font-family: 'Open Sans', sans-serif; padding: 20px 14px; display: flex; flex-direction: column; gap: 4px;">
<a href="{{homeHref}}" style="display: flex; align-items: center; gap: 12px; padding: 4px 8px 18px; text-decoration: none; color: #FFFFFF;">
<img src="../../assets/logo-gold-on-navy.png" alt="CB Environment Solutions" style="height: 44px; width: auto;">
<span style="display: flex; flex-direction: column; line-height: 1.15;"><span style="font-family: 'Fira Sans', sans-serif; font-weight: 700; font-size: 17px;">Property Portal</span><span style="font-size: 12px; color: #C8BBA5;">by CB Environment Solutions</span></span>
</a>

<button type="button" aria-label="{{ctxAria}}" style="display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px; margin: 0 0 14px; border-radius: 12px; border: 1px solid #2E3290; background: #23266F; color: #FFFFFF; font-family: inherit;">
<span style="{{ctxTile}}">{{ctxInitials}}</span>
<span style="flex: 1; min-width: 0; line-height: 1.25;"><span style="display: block; font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ctxName}}</span><span style="display: block; font-size: 12px; color: #C9CAF0;">{{ctxSub}}</span></span>
<sc-if value="{{showSwitch}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9CAF0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l4-4 4 4M16 15l-4 4-4-4"></path></svg></sc-if>
</button>

<p style="margin: 4px 10px 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: #9FA2D6;">{{groupOne}}</p>
<sc-for list="{{main}}" as="item" hint-placeholder-count="5">
<a href="{{item.href}}" style="{{item.style}}" aria-current="{{item.current}}">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="{{item.d}}"></path></svg>
<span style="flex: 1;">{{item.label}}</span>
<sc-if value="{{item.badge}}" hint-placeholder-val="{{ false }}"><span style="{{item.badgeStyle}}">{{item.badge}}</span></sc-if>
</a>
</sc-for>
<sc-if value="{{hasAcct}}" hint-placeholder-val="{{ true }}">
<p style="margin: 18px 10px 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: #9FA2D6;">ORGANIZATION</p>
<sc-for list="{{acct}}" as="item" hint-placeholder-count="1">
<a href="{{item.href}}" style="{{item.style}}" aria-current="{{item.current}}">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="{{item.d}}"></path></svg>
<span style="flex: 1;">{{item.label}}</span>
<sc-if value="{{item.badge}}" hint-placeholder-val="{{ false }}"><span style="{{item.badgeStyle}}">{{item.badge}}</span></sc-if>
</a>
</sc-for>
</sc-if>

<div style="margin-top: auto; padding: 14px 10px 0; border-top: 1px solid #2E3290; display: flex; flex-direction: column; gap: 10px; font-size: 13px;">
<div style="background: #23266F; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px;">
<span style="font-weight: 700; color: #FFFFFF;">Need CBES?</span>
<span style="color: #C9CAF0; font-size: 12.5px;">We reply within 24 hours.</span>
<a href="mailto:office@cbenvironments.com" style="color: #C8BBA5; font-weight: 700; text-decoration: none;">office@cbenvironments.com</a>
</div>
<span style="color: #9FA2D6;">Aiming for Excellence</span>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["rep","manager"],"default":"rep"},"active":{"editor":"enum","options":["dashboard","violations","issues","reports","overwatch","settings"],"default":"dashboard"},"$preview":{"width":248,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const role = this.props.role ?? 'rep';
    const active = this.props.active ?? 'dashboard';
    const rep = role === 'rep';
    const base = 'display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 0 12px; border-radius: 10px; font-size: 14.5px; font-weight: 600; text-decoration: none;';
    const on = base + ' background: #FFFFFF; color: #1A1C5E;';
    const off = base + ' color: #E6E7F2;';
    const pill = 'font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;';
    const mk = (key, label, href, d, badge, tone) => ({
      label, href, d, badge: badge || '',
      style: active === key ? on : off,
      current: active === key ? 'page' : 'false',
      badgeStyle: pill + (tone === 'muted' ? ' background: #2E3290; color: #C9CAF0;' : tone === 'gold' ? ' background: #928064; color: #FFFFFF;' : ' background: #E04F3A; color: #FFFFFF;'),
    });
    const homeHref = rep ? 'Rep-Dashboard.dc.html' : 'Rep-ManagerDashboard.dc.html';
    const icons = {
      dash: 'M4 13h6V4H4zM14 20h6v-9h-6zM14 4v4h6V4zM4 20h6v-3H4z',
      viol: 'M12 3l9 16H3zM12 10v4M12 17.5v.01',
      issue: 'M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12zM8.5 10.5h7M8.5 14h4',
      rep: 'M4 20V10M10 20V4M16 20v-7M22 20H2',
      watch: 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',
      set: 'M16 19v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 8v6M22 11h-6',
    };
    const main = rep ? [
      mk('dashboard', 'Dashboard', homeHref, icons.dash),
      mk('violations', 'Violations', 'Rep-Violations.dc.html', icons.viol, '5'),
      mk('issues', 'Resident issues', 'Rep-Issues.dc.html', icons.issue, '3'),
      mk('reports', 'Reports', 'Rep-Reports.dc.html', icons.rep),
    ] : [
      mk('dashboard', 'My property', homeHref, icons.dash),
      mk('violations', 'Violations', 'Rep-Violations.dc.html', icons.viol, '3'),
      mk('issues', 'Resident issues', 'Rep-Issues.dc.html', icons.issue, '1'),
      mk('reports', 'Reports', 'Rep-Reports.dc.html', icons.rep),
      mk('overwatch', 'Overwatch', 'Rep-ManagerDashboard.dc.html', icons.watch, 'Phase 2', 'muted'),
    ];
    const acct = [mk('settings', 'Team and settings', 'Rep-Settings.dc.html', icons.set, '1', 'gold')];
    return {
      homeHref, main, acct, hasAcct: rep, showSwitch: rep,
      groupOne: rep ? 'PORTFOLIO' : 'PROPERTY',
      ctxInitials: rep ? 'PR' : 'OD',
      ctxName: rep ? 'Peachtree Residential' : 'The Oaks at Decatur',
      ctxSub: rep ? '6 properties · Representative' : 'Peachtree Residential',
      ctxAria: rep ? 'Organization: Peachtree Residential. Switch organization' : 'Property: The Oaks at Decatur',
      ctxTile: 'flex: none; width: 38px; height: 38px; border-radius: 10px; background: ' + (rep ? '#928064' : '#3A3E99') + '; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center;',
    };
  }
}
</script>
</body>
</html>

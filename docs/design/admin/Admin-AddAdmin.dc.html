<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add an admin</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@500;600;700&amp;family=Open+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#272B84}a:hover{color:#1A1C5E}
</style>
</helmet>
<div style="width: 1440px; height: 1100px; box-sizing: border-box; background: #3B3D63; font-family: 'Open Sans', sans-serif; color: #1A1C3D; padding: 56px 0; display: flex; justify-content: center; align-items: flex-start;">
<div role="dialog" aria-modal="true" aria-labelledby="aa-title" style="width: 640px; background: #FFFFFF; border-radius: 20px; box-shadow: 0 24px 60px rgba(10,12,40,0.45); overflow: hidden;">

<div style="background: #1A1C5E; color: #FFFFFF; padding: 22px 26px; display: flex; justify-content: space-between; gap: 14px; align-items: flex-start;">
<div style="display: flex; gap: 14px; align-items: center;">
<span style="flex: none; width: 46px; height: 46px; border-radius: 12px; background: #928064; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg></span>
<div><h1 id="aa-title" style="margin: 0; font-family: 'Fira Sans', sans-serif; font-size: 22px;">Add an admin</h1><p style="margin: 2px 0 0; font-size: 13px; color: #C8BBA5;">Only the Super Admin can do this</p></div>
</div>
<a href="Admin-Users.dc.html" aria-label="Close" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid #3A3E99; display: flex; align-items: center; justify-content: center; color: #FFFFFF;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>

<div style="padding: 22px 26px; display: flex; flex-direction: column; gap: 18px;">
<div role="tablist" aria-label="How to add" style="display: flex; background: #F4F5FA; border-radius: 12px; padding: 4px;">
<button type="button" role="tab" aria-selected="false" style="flex: 1; height: 40px; border: none; border-radius: 9px; background: transparent; color: #4A4C63; font-weight: 600; font-size: 14px;">Invite someone new</button>
<button type="button" role="tab" aria-selected="true" style="flex: 1; height: 40px; border: none; border-radius: 9px; background: #FFFFFF; color: #1A1C5E; font-weight: 700; font-size: 14px; box-shadow: 0 1px 3px rgba(26,28,94,0.15);">Upgrade an existing user</button>
</div>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; font-weight: 600;">Find a user
<span style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px; border-radius: 10px; border: 1px solid #C9CAD6;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A4C63" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input type="search" value="Dana" style="flex: 1; border: none; outline: none; font-size: 14.5px;"></span></label>

<div style="border: 2px solid #272B84; border-radius: 14px; padding: 14px; display: flex; gap: 12px; align-items: center; background: #F8F8FD;">
<span style="flex: none; width: 44px; height: 44px; border-radius: 50%; background: #1A1C5E; color: #FFFFFF; font-weight: 700; display: flex; align-items: center; justify-content: center;">DB</span>
<span style="flex: 1; min-width: 0;"><strong style="display: block; font-size: 15px;">Dana Brooks</strong><span style="font-size: 12.5px; color: #4A4C63;">dana@cbenvironments.com · Passkey on</span></span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700;"><span style="padding: 4px 10px; border-radius: 999px; background: #EEEFF8; color: #272B84;">Steward</span><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A4C63" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg><span style="padding: 4px 10px; border-radius: 999px; background: #272B84; color: #FFFFFF;">Admin</span></span>
</div>

<section style="background: #F8F8FB; border-radius: 12px; padding: 14px 16px;">
<h2 style="margin: 0 0 10px; font-size: 14px; font-weight: 700;">What an admin can do</h2>
<ul style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; font-size: 13px;">
<sc-for list="{{can}}" as="c" hint-placeholder-count="6"><li style="display: flex; gap: 8px; align-items: flex-start;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{c.color}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 2px;"><path d="{{c.icon}}"></path></svg><span>{{c.text}}</span></li></sc-for>
</ul>
</section>

<label style="display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; line-height: 1.5;"><input type="checkbox" checked style="margin-top: 3px; accent-color: #272B84; width: 18px; height: 18px;">I understand Dana will see every organization, property, report and quote. Dana keeps Steward duties in the field.</label>

<div style="display: flex; gap: 10px; align-items: center; background: #FFF4DB; color: #6B4A00; border-radius: 12px; padding: 12px 14px; font-size: 13px; font-weight: 600;">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
You'll confirm with your passkey. Dana and Nigel get an email, and the change is logged.
</div>
</div>

<div style="display: flex; justify-content: flex-end; gap: 8px; padding: 16px 26px; border-top: 1px solid #E4E4EC; background: #FAFAFD;">
<a href="Admin-Users.dc.html" style="height: 44px; display: inline-flex; align-items: center; padding: 0 18px; border-radius: 10px; border: 1px solid #C9CAD6; background: #FFFFFF; color: #1A1C3D; font-weight: 600; font-size: 14px; text-decoration: none;">Cancel</a>
<a href="Admin-Users.dc.html" style="height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 18px; border-radius: 10px; background: #1A1C5E; color: #FFFFFF; font-weight: 700; font-size: 14px; text-decoration: none;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C8BBA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path></svg>Confirm with passkey and upgrade</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const yes = 'M20 6L9 17l-5-5', no = 'M6 6l12 12M18 6L6 18';
    const can = [
      [1, 'See and manage every organization and property'],
      [1, 'Create organizations'],
      [1, 'Review violations and resident reports'],
      [1, 'Send weekly reports and respond to quotes'],
      [1, 'Invite and remove users'],
      [0, 'Add or upgrade admins (Super Admin only)'],
    ].map(c => ({ text: c[1], icon: c[0] ? yes : no, color: c[0] ? '#1F6B3A' : '#B42318' }));
    return { can };
  }
}
</script>
</body>
</html>

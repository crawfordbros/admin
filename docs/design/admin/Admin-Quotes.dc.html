<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin Portal – Quotes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@500;600;700&amp;family=Open+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#272B84}a:hover{color:#1A1C5E}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 1400px; background: #F4F5FA; font-family: 'Open Sans', sans-serif; color: #1A1C3D;">
<div style="flex: 1 1 248px; max-width: 100%; background: #1A1C5E;"><dc-import name="AdminSidebar" active="quotes" hint-size="248px,960px"></dc-import></div>
<div style="flex: 999 1 640px; min-width: 0;">
<dc-import name="AdminTopbar" crumb="Quotes" hint-size="100%,64px"></dc-import>
<main style="padding: 28px 32px 56px; display: flex; flex-direction: column; gap: 20px;">

<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px;">
<div>
<h1 style="margin: 0; font-family: 'Fira Sans', sans-serif; font-size: 30px; color: #1A1C5E;">Quotes</h1>
<p style="margin: 6px 0 0; font-size: 15px; color: #4A4C63;">Requests from the website, replies from <strong style="color: #1A1C3D;">quotes@cbenvironments.com</strong>, and contracts out for signature.</p>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap;">
<div role="group" aria-label="Layout" style="display: flex; background: #FFFFFF; border: 1px solid #E4E4EC; border-radius: 10px; padding: 3px;">
<button type="button" aria-pressed="true" style="height: 34px; padding: 0 12px; border: none; border-radius: 8px; background: #272B84; color: #FFFFFF; font-size: 13px; font-weight: 700;">Pipeline</button>
<button type="button" style="height: 34px; padding: 0 12px; border: none; border-radius: 8px; background: transparent; color: #1A1C3D; font-size: 13px; font-weight: 600;">List</button>
</div>
<button type="button" style="height: 42px; display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; border-radius: 10px; border: none; background: #272B84; color: #FFFFFF; font-weight: 700; font-size: 14px;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>New quote</button>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px;">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="5"><div style="background: #FFFFFF; border: 1px solid #E4E4EC; border-radius: 14px; padding: 16px;"><p style="margin: 0; font-size: 12.5px; font-weight: 600; color: #4A4C63;">{{k.label}}</p><p style="margin: 4px 0 0; font-family: 'Fira Sans', sans-serif; font-size: 26px; font-weight: 700; color: #1A1C5E;">{{k.value}}</p><p style="{{k.subStyle}}">{{k.sub}}</p></div></sc-for>
</div>

<div style="display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; align-items: flex-start;">
<sc-for list="{{cols}}" as="c" hint-placeholder-count="5">
<section style="flex: 0 0 268px; background: #ECEDF5; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 2px 4px;"><h2 style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700;"><span style="{{c.dot}}"></span>{{c.title}}</h2><span style="font-size: 12px; font-weight: 700; color: #4A4C63; background: #FFFFFF; padding: 2px 8px; border-radius: 999px;">{{c.count}}</span></div>
<p style="margin: -4px 4px 0; font-size: 12px; color: #4A4C63;">{{c.sub}}</p>
<sc-for list="{{c.cards}}" as="q" hint-placeholder-count="2">
<a href="Admin-QuoteDetail.dc.html" style="{{q.style}}">
<span style="display: flex; justify-content: space-between; gap: 8px; align-items: flex-start;"><span><strong style="display: block; font-size: 14.5px;">{{q.community}}</strong><span style="font-size: 12px; color: #4A4C63;">{{q.company}}</span></span><span style="{{q.ageStyle}}">{{q.age}}</span></span>
<span style="display: flex; gap: 6px; flex-wrap: wrap;"><span style="font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: #EEEFF8; color: #272B84;">{{q.units}} units</span><sc-for list="{{q.services}}" as="s" hint-placeholder-count="2"><span style="font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: #F4F5FA; color: #3A3C50;">{{s}}</span></sc-for></span>
<span style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #4A4C63;"><span style="display: flex; align-items: center; gap: 6px;"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{q.icon}}"></path></svg>{{q.meta}}</span><span style="{{q.ownerStyle}}">{{q.owner}}</span></span>
</a>
</sc-for>
</section>
</sc-for>
</div>

</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    const sub = (c) => 'margin: 2px 0 0; font-size: 12px; font-weight: 600; color: ' + c + ';';
    const kpis = [['New requests', '3', '1 waiting over 24h', '#B42318'], ['Avg first response', '9.4h', 'Goal: same day', '#4A4C63'], ['Quotes out', '2', '640 units', '#4A4C63'], ['Contracts out', '1', 'Sent Oct 22', '#4A4C63'], ['Won this quarter', '3', '57% win rate', '#1F6B3A']].map(k => ({ label: k[0], value: k[1], sub: k[2], subStyle: sub(k[3]) }));
    const card = (hot) => 'display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 12px; background: #FFFFFF; text-decoration: none; color: #1A1C3D; ' + (hot ? 'border: 2px solid #272B84; box-shadow: 0 6px 16px rgba(39,43,132,0.14);' : 'border: 1px solid #E4E4EC;');
    const age = (late) => 'flex: none; font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 999px; ' + (late ? 'background: #FDECEA; color: #B42318;' : 'background: #F0F0F4; color: #4A4C63;');
    const owner = (c) => 'width: 24px; height: 24px; border-radius: 50%; background: ' + c + '; color: #FFFFFF; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;';
    const I = { mail: 'M4 6h16v12H4zM4 7l8 6 8-6', doc: 'M14 3H6v18h12V7zM14 3v4h4M9 13h6M9 17h6', pen: 'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z', check: 'M20 6L9 17l-5-5' };
    const q = (community, company, units, services, ageTxt, late, meta, icon, ow, oc, hot) => ({ community, company, units, services, age: ageTxt, ageStyle: age(late), meta, icon: I[icon], owner: ow, ownerStyle: owner(oc), style: card(hot) });
    const dot = (c) => 'width: 9px; height: 9px; border-radius: 50%; background: ' + c + ';';
    const cols = [
      { title: 'New', sub: 'Reply within 24 hours', c: '#B42318', cards: [
        q('Harbor Pointe Apartments', 'Harbor Point Management', 220, ['Valet', 'Washing'], '26h', true, 'Website form', 'mail', 'NC', '#272B84', true),
        q('Stone Mountain Village', 'Magnolia Living', 184, ['Valet'], '6h', false, 'Website form', 'mail', '—', '#A9ABC9', false),
        q('Duluth Commons', 'Oakline Properties', 300, ['Valet', 'Bulk'], '2h', false, 'Contact form', 'mail', '—', '#A9ABC9', false),
      ] },
      { title: 'In conversation', sub: 'Questions, site visit', c: '#D99A1E', cards: [
        q('Smyrna Heights', 'Summit Ridge Communities', 276, ['Valet', 'Lot cleanup'], '3d', false, '4 emails · site visit Thu', 'mail', 'NG', '#3A3E99', false),
      ] },
      { title: 'Quote sent', sub: 'Waiting on decision', c: '#272B84', cards: [
        q('Lenox Park Residences', 'Independent', 410, ['Valet', 'Washing'], '5d', false, 'Quote PDF viewed twice', 'doc', 'NC', '#272B84', false),
        q('Midtown Grove', 'Peachtree Residential', 230, ['Valet'], '2d', false, 'Quote PDF sent', 'doc', 'NG', '#3A3E99', false),
      ] },
      { title: 'Contract sent', sub: 'Out for signature', c: '#7A6A50', cards: [
        q('North Druid Flats', 'Peachtree Residential', 360, ['Valet', 'Washing'], '5d', false, '36-month agreement', 'pen', 'NC', '#272B84', false),
      ] },
      { title: 'Won', sub: 'Signed this quarter', c: '#1F6B3A', cards: [
        q('Marietta Pines', 'Summit Ridge Communities', 240, ['Valet'], 'Oct 2', false, 'Signed 12-month', 'check', 'NG', '#3A3E99', false),
        q('Tucker Station', 'Magnolia Living', 320, ['Valet', 'Bulk'], 'Sep 18', false, 'Signed 36-month', 'check', 'NC', '#272B84', false),
      ] },
    ].map(c => ({ ...c, count: c.cards.length, dot: dot(c.c) }));
    return { kpis, cols };
  }
}
</script>
</body>
</html>

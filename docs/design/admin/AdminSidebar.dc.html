<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@500;600;700&amp;family=Open+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Admin Portal" style="width: 100%; min-height: 960px; box-sizing: border-box; background: #1A1C5E; color: #E6E7F2; font-family: 'Open Sans', sans-serif; padding: 20px 14px; display: flex; flex-direction: column; gap: 4px;">
<a href="Dashboard.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 4px 8px 20px; text-decoration: none; color: #FFFFFF;">
<img src="../../assets/logo-gold-on-navy.png" alt="CB Environment Solutions" style="height: 44px; width: auto;">
<span style="display: flex; flex-direction: column; line-height: 1.15;"><span style="font-family: 'Fira Sans', sans-serif; font-weight: 700; font-size: 17px;">Admin Portal</span><span style="font-size: 12px; color: #C8BBA5;">CBES operations</span></span>
</a>
<p style="margin: 8px 10px 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: #9FA2D6;">OPERATIONS</p>
<sc-for list="{{ops}}" as="item" hint-placeholder-count="5">
<a href="{{item.href}}" style="{{item.style}}" aria-current="{{item.current}}">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="{{item.d}}"></path></svg>
<span style="flex: 1;">{{item.label}}</span>
<sc-if value="{{item.badge}}" hint-placeholder-val="{{ false }}"><span style="{{item.badgeStyle}}">{{item.badge}}</span></sc-if>
</a>
</sc-for>
<p style="margin: 18px 10px 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: #9FA2D6;">ACCOUNTS</p>
<sc-for list="{{acct}}" as="item" hint-placeholder-count="4">
<a href="{{item.href}}" style="{{item.style}}" aria-current="{{item.current}}">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="{{item.d}}"></path></svg>
<span style="flex: 1;">{{item.label}}</span>
<sc-if value="{{item.badge}}" hint-placeholder-val="{{ false }}"><span style="{{item.badgeStyle}}">{{item.badge}}</span></sc-if>
</a>
</sc-for>
<div style="margin-top: auto; padding: 14px 10px 0; border-top: 1px solid #2E3290; display: flex; flex-direction: column; gap: 10px; font-size: 13px;">
<a href="Main.dc.html" style="color: #C8BBA5; text-decoration: none; display: flex; align-items: center; gap: 10px;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg>View website</a>
<span style="color: #9FA2D6;">Aiming for Excellence</span>
</div>
</nav>
</x-dc>

</body>
</html>
